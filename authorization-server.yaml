server:
  port: ${PORT:9000}
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  # OAuth2 Authorization Server Clients configured
  security:
    oauth2:
      authorizationserver:
        client:
          banking-client:
            registration:
              client-id: ${BANKING_CLIENT_ID:banking-client}
              client-secret: ${BANKING_CLIENT_SECRET:{noop}banking-secret}
              client-authentication-methods:
                - "client_secret_basic"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - ${BANKING_CLIENT_REDIRECT_URI:http://localhost:3000/login/oauth2/code/banking-client}
              post-logout-redirect-uris:
                - ${BANKING_CLIENT_POST_LOGOUT_URI:http://localhost:3000}
              scopes:
                - "openid"
                - "profile"
                - "banking.read"
                - "banking.write"
            token:
              access-token-time-to-live: 1h
              refresh-token-time-to-live: 7d
# Eureka Server Configuration
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      readinessstate:
        enabled: true
      show-details: never
info:
  app:
    name: authorization-server
    description: "Bank Authorization Server"
    version: "1.0.0"
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH}
  level:
    root: ${LOG_LEVEL_ROOT}
    com.banking.authorization: ${LOG_LEVEL}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
banking:
  security:
    login-url: ${LOGIN_URL:/login}
    public-endpoints:
      - /api/v1/auth/**
      - /oauth2/**
      - /.well-known/**
      - /actuator/**
      - /error
    jwt:
      issuer: ${JWT_ISSUER:authorization-server}
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 604800
    rsa:
      key-id: ${RSA_KEY_ID:banking-auth-key-1}
      public-key-location: ${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public_key.pem}
      private-key-location: ${RSA_PRIVATE_KEY_LOCATION:classpath:keys/private_key.pem}
