server:
  port: ${PORT:8282}
spring:
  threads:
    virtual:
      enabled: true
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: NotificationPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    cloud:
      function:
        definition: processEmail
      stream:
        default:
          content-type: application/json
        bindings:
          processEmail-in-0:
            destination: email.notifications.queue
            group: email-worker-group
            content-type: application/json
            consumer:
              concurrency: 3
              maxAttempts: 5
              backOffInitialInterval: 2000
              backOffMaxInterval: 30000
              backOffMultiplier: 2.0
        rabbit:
          bindings:
            processEmail-in-0:
              consumer:
                autoBindDlq: true
                republishToDlq: true
                requeueRejected: false
                deadLetterQueueName: email.notifications.dlq
                ttl: 300000                        # 5 min in the main queue, then dead-lettered
                dlqTtl: 604800000                  # 7 days in the DLQ
                dlqMaxLength: 10000
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    thymeleaf:
      prefix: classpath:/templates
      suffix: .html
      mode: HTML
      encoding: UTF-8
      cache: false
mail:
  from:
    address: no-reply@banking.com
    name: Digital Banking Support
# Eureka Server Configuration
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      readinessstate:
        enabled: true
      show-details: never
info:
  app:
    name: notification-service
    description: "Bank notification management service"
    version: "1.0.0"
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH}
  level:
    root: ${LOG_LEVEL_ROOT}
    com.banking.notification: ${LOG_LEVEL}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
